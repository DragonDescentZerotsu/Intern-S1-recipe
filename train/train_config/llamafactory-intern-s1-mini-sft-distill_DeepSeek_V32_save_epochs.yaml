### model
model_name_or_path: internlm/Intern-S1-mini
#image_max_pixels: 262144
#video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full # lora / full
#lora_target: all
#lora_rank: 16
#lora_alpha: 32
#lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: train/train_config/ds_z3_config.json
flash_attn: fa2

### dataset
dataset_dir: DataPrepare/SFT_data/DeepSeek_V32_distill_agent_data/TDC_train_Alpaca_merged_scaffold_split  # SFT_data/SFT_data for TDC
dataset: TDC_train_Alpaca_merged  # TDC_SFT_data_all_tasks for TDC // ChemCoT_SFT_data_all_tasks for ChemCoT
template: empty  # DeepSeek_V32 注意用这个 empty 的格式
cutoff_len: 55000
tokenized_path: DataPrepare/SFT_data/DeepSeek_V32_distill_agent_data/TDC_train_Alpaca_merged_scaffold_split/tokenzied
max_samples: null
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 16
# enable_thinking: true  # false for TDC

### output
output_dir: checkpoints/Intern-S1-mini/full/sft-distill_DeepSeek_V32-TDC-train-set-scaffold
logging_steps: 100
save_strategy: epoch
# save_steps: 5000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: Intern-S1-mini_full_distill_sft_DeepSeekV32_TDC_scaffold
include_effective_tokens_per_second: true

### train
per_device_train_batch_size: 1 # 4
gradient_accumulation_steps: 1
learning_rate: 1e-5
num_train_epochs: 8
lr_scheduler_type: cosine
warmup_ratio: 0.005
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
